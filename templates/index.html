<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bengaluru House Price Predictor</title>

    <link rel="stylesheet" href="../static/style.css">

</head>

<body>

    <div class="main-container">
        <div class="left-section">
            
            <div class="brand-tag">
                ML Powered
            </div>

            <h1>
                Bengaluru <br>
                House Price Predictor
            </h1>

            <p>
                Estimate residential property valuation using machine learning
                trained on Bengaluru housing data.
            </p>
        </div>

        <div class="right-section">

            <form id="prediction-form">

                <div class="input-group">

                    <label>Location</label>

                    <select id="location" required>

                        <option value="">Select location</option>

                        {% for loc in locations %}
                            <option value="{{ loc }}">{{ loc }}</option>
                        {% endfor %}

                    </select>

                </div>

                <div class="grid-2">

                    <div class="input-group">

                        <label>Total Sqft</label>

                        <input
                            type="number"
                            id="total_sqft"
                            placeholder="1200"
                            min="600"
                            max="2000"
                            required
                        >
                    </div>

                    <div class="input-group">

                        <label>BHK</label>

                        <input
                            type="number"
                            id="bhk"
                            placeholder="2"
                            min="1"
                            max="10"
                            required
                        >

                    </div>

                </div>

                <div class="grid-2">

                    <div class="input-group">

                        <label>Bathrooms</label>

                        <input
                            type="number"
                            id="bath"
                            placeholder="2"
                            min="1"
                            max="10"
                            required
                        >

                    </div>

                    <div class="input-group">

                        <label>Balcony</label>

                        <input
                            type="number"
                            id="balcony"
                            placeholder="1"
                            min="1"
                            max="10"
                            required
                        >

                    </div>

                </div>

                <button type="submit">
                    Predict Price
                </button>

            </form>

            <div id="result-box"></div>

        </div>

    </div>

    <script src="../static/script.js"></script>

</body>
</html>
